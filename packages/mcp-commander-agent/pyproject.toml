[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-commander-agent"
version = "0.1.0"
description = "AI agent orchestrator for CAD automation via MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "faster-whisper>=1.0.0",
    "pygame>=2.5.0",
    "sounddevice>=0.4.0",
    "pyttsx3>=2.90",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
mcp-commander = "mcp_commander_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_commander_agent"]
