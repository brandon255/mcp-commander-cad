[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion360-mcp"
version = "0.1.0"
description = "MCP server for Fusion 360 automation via Autodesk API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
fusion360-mcp = "fusion360_mcp.server:main"
