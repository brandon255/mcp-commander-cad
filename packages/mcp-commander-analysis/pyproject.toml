[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-commander-analysis"
version = "0.1.0"
description = "MCP server for AI-powered engineering drawing analysis (VLM, OCR, RAG)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]

[project.scripts]
mcp-commander-analysis = "mcp_commander_analysis.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_commander_analysis"]
