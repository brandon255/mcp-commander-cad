[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-commander-materials"
version = "0.1.0"
description = "Material selection and property lookup MCP cartridge for MCP Commander"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
mcp-commander-materials = "mcp_commander_materials.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_commander_materials"]
