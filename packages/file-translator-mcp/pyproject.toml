[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-translator-mcp"
version = "1.0.0"
description = "CAD file format translator MCP server. Converts between STL, STEP, IGES, OBJ, PLY, 3MF, DXF with mesh repair and analysis."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
    "cadquery>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
file-translator-mcp = "file_translator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/file_translator_mcp"]
